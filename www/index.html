<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的小窝">
<title>我的小窝</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div class="topbar">
  <span class="title" id="topTitle">剧场</span>
  <span class="subtitle" id="topSub">我的小窝</span>
</div>

<!-- ===== 视图容器 ===== -->
<div id="view-container">
  <!-- ① 对聊剧场 -->
  <section class="view active" id="view-theater" data-title="剧场">
    <div id="theater-main"></div>
  </section>

  <!-- ② 跑步计划 -->
  <section class="view" id="view-running" data-title="跑步"></section>

  <!-- ③ 电脑桥 -->
  <section class="view" id="view-bridge" data-title="电脑桥"></section>
</div>

<!-- ===== 底部导航 ===== -->
<nav class="tabbar">
  <button class="tab active" data-view="theater">
    <svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg>
    剧场
  </button>
  <button class="tab" data-view="running">
    <svg viewBox="0 0 24 24"><circle cx="13.5" cy="5" r="1.6"/><path d="M6 21l3-5 4-3 2-4 3 2-3 4 3 6"/><path d="M9 13l-3 1"/><path d="M14 7l-1 2-3 1"/></svg>
    跑步
  </button>
  <button class="tab" data-view="bridge">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M9 20h6M12 16v4"/><path d="M7 10v.01M11 10v.01M15 10v.01"/></svg>
    电脑桥
  </button>
</nav>

<script src="js/storage.js"></script>
<script src="js/api.js"></script>
<script src="js/theater.js"></script>
<script src="js/app.js"></script>
</body>
</html>
